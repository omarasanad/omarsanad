function mucosaCanvas(w,h,base,vessel,density){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,w,h);

  g.globalAlpha=1;return c}
const mucTex=new THREE.CanvasTexture(mucosaCanvas(1024,1024,'#E59A86','#A3232E',70));mucTex.wrapS=mucTex.wrapT=THREE.RepeatWrapping;mucTex.colorSpace=THREE.SRGBColorSpace;mucTex.anisotropy=8;

const colonCurve=new THREE.CatmullRomCurve3(P,false,'catmullrom',0.4);
function radiusAt(s,ang){
  let base=s<0.22?0.205:s<0.55?0.17:s<0.72?0.15:s<0.9?0.135:0.155;
  if(s<0.03)base*=0.85+5*s;

  const hb=inR?0:Math.pow(Math.abs(Math.sin(Math.PI*s*N)),0.55);
