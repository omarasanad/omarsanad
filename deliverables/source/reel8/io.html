<!doctype html><html lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:CXB;src:url(fonts/Cairo-ExtraBold.ttf)}@font-face{font-family:CSB;src:url(fonts/Cairo-SemiBold.ttf)}
html,body{margin:0;width:1080px;height:1920px;background:#000;overflow:hidden}
#bg{position:absolute;inset:0;background:url(bg9.png) center/cover}
#dim{position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 48%,rgba(10,6,4,.25),rgba(5,3,2,.88))}
#shaft{position:absolute;left:-300px;top:-200px;width:1500px;height:1700px;background:repeating-linear-gradient(118deg,rgba(255,200,140,0) 0 120px,rgba(255,190,120,.10) 160px,rgba(255,200,140,0) 230px);filter:blur(18px);mix-blend-mode:screen}
#dust{position:absolute;inset:0}
.p{position:absolute;border-radius:50%;background:rgba(255,215,170,.55);filter:blur(1.5px)}
#card{position:absolute;left:90px;width:900px}
#card img{width:900px;border-radius:30px;display:block;box-shadow:0 30px 90px rgba(0,0,0,.6)}
#sweep{position:absolute;inset:0;border-radius:30px;overflow:hidden;pointer-events:none}
#sweep div{position:absolute;top:-40%;width:180px;height:180%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,236,210,.55),rgba(255,255,255,0));transform:rotate(18deg)}
#line{position:absolute;left:140px;height:4px;border-radius:4px;background:linear-gradient(90deg,rgba(47,208,192,0),#2FD0C0,rgba(47,208,192,0));box-shadow:0 0 18px rgba(47,208,192,.8)}
#loc{position:absolute;left:0;width:1080px;direction:rtl;text-align:center;font-family:CSB;font-size:46px;color:#F1E3D3;letter-spacing:.5px}
#glow{position:absolute;left:140px;width:800px;height:420px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,170,90,.35),rgba(255,170,90,0));filter:blur(10px)}
#bars{position:absolute;inset:0;pointer-events:none}#bars:before,#bars:after{content:"";position:absolute;left:0;width:1080px;height:127px;background:#000}#bars:before{top:0}#bars:after{bottom:0}
#black{position:absolute;inset:0;background:#000}
</style></head><body>
<div id="bg"></div><div style="position:absolute;inset:0;overflow:hidden"><div id="shaft"></div></div><div id="dim"></div><div id="dust"></div><div id="glow"></div>
<div id="card"><img src="logo.png"><div id="sweep"><div id="sw"></div></div></div><div id="line"></div><div id="loc">مركز النهضة الطبي · شبين القناطر</div>
<div id="bars"></div><div id="black"></div>
<script>
const $=id=>document.getElementById(id),clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),seg=(t,a,b)=>clamp((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,eout=x=>1-Math.pow(1-x,3);
let s=3;const R=()=>(s=(s*16807)%2147483647)/2147483647;const P=[...Array(46)].map(()=>({x:R()*1080,y:200+R()*1500,r:2+R()*5,v:8+R()*18,ph:R()*6}));
$('dust').innerHTML=P.map((p,i)=>`<div class="p" id="p${i}" style="width:${p.r*2}px;height:${p.r*2}px"></div>`).join('');
window.render=function(mode,t){const T=mode==='intro'?2.6:4.6;
  P.forEach((p,i)=>{const e=$('p'+i);e.style.transform=`translate(${p.x+12*Math.sin(t*.6+p.ph)}px,${p.y-p.v*t}px)`;e.style.opacity=.25+.35*Math.abs(Math.sin(t*.8+p.ph))});
  $('shaft').style.transform=`translateX(${t*26}px)`;$('bg').style.transform=`scale(${1.06+.025*t/T})`;
  let cy,cs,co,line,loc,black,sw;
  if(mode==='intro'){co=eout(seg(t,.35,1.05));cs=.9+.1*eout(seg(t,.35,1.3));cy=880-30*(1-eout(seg(t,.35,1.2)));
    line=eio(seg(t,.15,.9));sw=seg(t,.9,1.7);loc=0;
    black=Math.max(1-seg(t,0,.45),0);
    // push-in and fade out into the footage
    const out=seg(t,2.0,2.6);$('card').style.filter=`blur(${out*6}px)`;co*=1-out;line*=1-out;document.body.style.transform=`scale(${1+.08*eio(out)})`;}
  else{co=eout(seg(t,.2,1.0));cs=.88+.12*eout(seg(t,.2,1.3))+.03*seg(t,1.3,4.6);cy=820-30*(1-eout(seg(t,.2,1.1)));
    line=eio(seg(t,.9,1.6));sw=seg(t,1.2,2.1);loc=eout(seg(t,1.6,2.2));black=seg(t,4.0,4.6);$('card').style.filter='none';document.body.style.transform='none';}
  const c=$('card');c.style.top=(cy-135)+'px';c.style.opacity=co;c.style.transform=`scale(${cs})`;
  $('sw').style.left=(-260+1400*eio(sw))+'px';$('sw').style.opacity=sw>0&&sw<1?1:0;
  const l=$('line');l.style.top=(cy+175)+'px';l.style.width=(800*line)+'px';l.style.left=(540-400*line)+'px';l.style.opacity=line>0?1:0;
  $('loc').style.top=(cy+205)+'px';$('loc').style.opacity=loc;$('loc').style.transform=`translateY(${(1-loc)*20}px)`;
  $('glow').style.top=(cy-210)+'px';$('glow').style.opacity=.6*co+.25*Math.sin(t*2)*co;
  $('black').style.opacity=black;return true};
window.ready=document.fonts.ready;
</script></body></html>
