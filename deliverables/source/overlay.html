<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:CXB;src:url(fonts/Cairo-ExtraBold.ttf)}
@font-face{font-family:CSB;src:url(fonts/Cairo-SemiBold.ttf)}
:root{--navy:#061A33;--navy2:#0B2A4B;--teal:#2FD0C0;--coral:#FF6A55;--ink:#E9F2F8}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
*{box-sizing:border-box}
#root{position:absolute;inset:0}
#panel{position:absolute;left:0;top:0;width:1080px;height:0;overflow:hidden;border-radius:0 0 40px 40px;
  background:radial-gradient(120% 60% at 50% 0%,#0F3560 0%,var(--navy) 60%),var(--navy)}
#panel .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(47,208,192,.10) 2px,transparent 2.5px);background-size:44px 44px}
#edge{position:absolute;left:60px;width:960px;height:5px;border-radius:5px;background:var(--teal);box-shadow:0 0 18px rgba(47,208,192,.7)}
.abs{position:absolute}
.c{transform-origin:center center}
.lbl{font-family:CXB;color:#fff;white-space:nowrap;line-height:1.25}
.sub{font-family:CSB;color:var(--ink);white-space:nowrap;line-height:1.3}
.pill{position:absolute;padding:6px 44px 14px;border-radius:999px;font-family:CXB;font-size:64px;color:#fff;white-space:nowrap}
.tile{position:absolute;border-radius:34px;background:rgba(255,255,255,.06);border:3px solid rgba(47,208,192,.55);display:flex;align-items:center;gap:26px;padding:0 34px}
.tile .t{font-family:CXB;font-size:48px;color:#fff;white-space:nowrap}
.card{position:absolute;border-radius:30px;background:rgba(6,26,51,.88);border:2px solid rgba(47,208,192,.35);box-shadow:0 18px 50px rgba(0,0,0,.35)}
svg{overflow:visible}
</style></head>
<body><div id="root">
  <div id="panel"><div class="dots"></div><div id="scenes"></div></div>
  <div id="edge"></div>
  <div id="free"></div>
</div>
<script src="timeline.js"></script>
<script src="icons.js"></script>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eout=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const bounce=x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375};
const lerp=(a,b,p)=>a+(b-a)*p;
function icon(name,size,color){const i=ICONS[name];return `<svg width="${size}" height="${size*i.h/i.w}" viewBox="0 0 ${i.w} ${i.h}" style="color:${color};display:block">${i.body}</svg>`}
function el(parent,html,cls,style){const d=document.createElement('div');d.className=cls||'abs';d.innerHTML=html;if(style)d.style.cssText+=style;$(parent).appendChild(d);return d}
// place element centred at (x,y)
function put(d,x,y,sc=1,op=1,rot=0){if(op<=0.001){d.style.display='none';d.style.opacity=0;return}
  d.style.left='0px';d.style.top='0px';d.style.display='block';
  const w=d.offsetWidth,h=d.offsetHeight;d.style.transform=`translate(${x-w/2}px,${y-h/2}px) scale(${sc}) rotate(${rot}deg)`;d.style.opacity=op;d.style.display=op<=0.001?'none':'block'}
function show(d,op){d.style.opacity=op;d.style.display=op<=0.001?'none':''}
// window envelope: fade in over [a,a+fi], out over [b-fo,b]
const env=(t,a,b,fi=.3,fo=.25)=>Math.min(seg(t,a,a+fi),1-seg(t,b-fo,b));

// ---------------- panel geometry from layout timeline ----------------
function panelState(t){
  const M=TL.modes;let bottom=TL.panel[M[0][1]],op=1;
  for(let i=1;i<M.length;i++){const [s,m,d,k]=M[i];const prev=TL.panel[M[i-1][1]];
    if(t<s)break;const p=eio(seg(t,s,s+d));
    if(k==='dissolve'&&M[i][1]==='S'){bottom=prev;op=1-p;if(p>=1){bottom=0;op=1}}
    else{bottom=lerp(prev,TL.panel[m],p);op=1}}
  return {bottom,op};
}

// ---------------- scene construction ----------------
const S={};
// A: acid
S.stom=el('scenes',icon('stomach',360,'#2FD0C0'));
S.flames=el('scenes',`<svg width="260" height="220" viewBox="0 0 260 220"><defs><linearGradient id="fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF3D2E"/><stop offset=".6" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FFC75A"/></linearGradient></defs>
 ${[0,1,2].map(i=>`<path id="fl${i}" d="M0,0 C-30,-40 -20,-80 0,-130 C8,-95 34,-80 28,-40 C26,-20 14,-6 0,0Z" fill="url(#fg)" transform="translate(${60+i*70},200)"/>`).join('')}</svg>`);
S.heat=el('scenes',`<svg width="300" height="200" viewBox="0 0 300 200">${[0,1,2].map(i=>`<path id="hw${i}" d="M${60+i*90},200 q-20,-25 0,-50 q20,-25 0,-50 q-20,-25 0,-50" stroke="#FF8A3D" stroke-width="7" fill="none" stroke-linecap="round" opacity=".7"/>`).join('')}</svg>`);
S.acidL=el('scenes','حموضة','pill','background:rgba(255,106,85,.16);border:3px solid #FF6A55');
// B: IBS
S.colon=el('scenes',icon('colon',380,'#2FD0C0'));
S.spasm=el('scenes',`<svg width="560" height="460" viewBox="0 0 560 460">${[[30,120,-20],[500,140,20],[40,350,15],[505,330,-15]].map(([x,y,r],i)=>`<polyline id="sp${i}" points="0,0 14,-18 28,0 42,-18 56,0 70,-18" transform="translate(${x},${y}) rotate(${r})" stroke="#FFC75A" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`).join('')}</svg>`);
S.ibsL=el('scenes','قولون عصبي','pill','background:rgba(47,208,192,.14);border:3px solid #2FD0C0');
// C: pain (full)
S.painFig=el('scenes',icon('intestinal-pain',600,'#E9F2F8'));
S.rings=el('scenes',`<svg width="600" height="600" viewBox="-300 -300 600 600">${[0,1,2].map(i=>`<circle id="rg${i}" r="40" fill="none" stroke="#FF6A55" stroke-width="8"/>`).join('')}<circle id="rgc" r="46" fill="#FF6A55" opacity=".35"/></svg>`);
S.painW=el('scenes','<div class="lbl" style="font-size:130px;color:#FF6A55">الوجع</div>');
S.painSub=el('scenes','<div class="sub" style="font-size:50px">اللي إنت فيه</div>');
// D: strike card (speaker mode)
S.strike=el('free',`<div class="card" style="position:relative;width:780px;height:230px">
  <div class="sub" style="position:absolute;top:22px;width:100%;text-align:center;font-size:44px;color:#2FD0C0">إنت مش مضطر</div>
  <div class="lbl" style="position:absolute;top:82px;width:100%;text-align:center;font-size:76px">تستحمل الوجع</div>
  <div id="strk" style="position:absolute;top:142px;right:150px;height:9px;width:0;border-radius:9px;background:#FF6A55;box-shadow:0 0 12px rgba(255,106,85,.8)"></div></div>`);
// E: clinic
S.clinicH=el('scenes',`<div style="display:flex;align-items:center;gap:22px">${icon('hospital',96,'#2FD0C0')}<div class="lbl" style="font-size:66px">في العيادة</div></div>`);
S.people=[];for(let r=0;r<3;r++)for(let c=0;c<5;c++)S.people.push(el('scenes',icon('person',96,(r+c)%3===0?'#2FD0C0':'#E9F2F8')));
// F: daily life (full)
S.dayT=el('scenes','<div class="lbl" style="font-size:80px">حياتها اليومية</div><div id="dayU" style="height:8px;border-radius:8px;background:#2FD0C0;width:0;margin:-6px auto 0"></div>');
S.tiles=['sleepy','nutrition','walking'].map(n=>el('scenes',`<div style="position:relative;width:250px;height:250px;border-radius:50%;background:rgba(255,255,255,.06);border:6px solid #2FD0C0;display:flex;align-items:center;justify-content:center">${icon(n,150,'#E9F2F8')}<div class="bdg" style="position:absolute;top:-14px;left:-14px;width:84px;height:84px;border-radius:50%;background:#061A33;display:flex;align-items:center;justify-content:center">${icon('alert-circle',84,'#FF6A55')}</div></div>`));
S.wave=el('scenes','<div style="width:1080px;height:12px;background:linear-gradient(90deg,transparent,#FF6A55 40%,#FF6A55 60%,transparent);filter:blur(2px)"></div>');
// G: logo + specialties
S.logo=el('free','<img src="logo.png" style="width:900px;border-radius:34px;display:block;box-shadow:0 20px 50px rgba(0,0,0,.35)">');
S.specs=[['الباطنة','internal-medicine'],['الجهاز الهضمي','stomach'],['الكبد','liver'],['المناظير','endo']].map(([t,n])=>el('scenes',
 `<div class="tile" style="position:relative;width:452px;height:170px">${n==='endo'?`<svg width="104" height="104" viewBox="0 0 100 100"><path d="M18 14 C 70 6, 88 30, 70 52 S 30 78, 64 90" stroke="#2FD0C0" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="64" cy="90" r="8" fill="#FFC75A"/><circle cx="64" cy="90" r="15" fill="#FFC75A" opacity=".3"/><rect x="4" y="6" width="22" height="16" rx="5" fill="#2FD0C0"/></svg>`:icon(n,104,'#2FD0C0')}<div class="t">${t}</div></div>`));
// H: location (full)
let st='';{let s=7;const R=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<26;i++){const y=R()*1920,x=R()*1080,len=300+R()*700,a=(R()<.5?0:90)+(R()-.5)*24;st+=`<line x1="${x}" y1="${y}" x2="${x+len*Math.cos(a*Math.PI/180)}" y2="${y+len*Math.sin(a*Math.PI/180)}" stroke="rgba(47,208,192,.16)" stroke-width="${R()<.25?16:6}" stroke-linecap="round"/>`}}
S.map=el('scenes',`<svg width="1080" height="1920" viewBox="0 0 1080 1920">${st}<path d="M-50 1500 C 300 1380, 520 1640, 1130 1450" stroke="rgba(47,208,192,.10)" stroke-width="60" fill="none"/></svg>`);
S.pin=el('scenes',`<svg width="180" height="240" viewBox="0 0 180 240"><path d="M90 236 C 40 160, 6 120, 6 84 A84 84 0 1 1 174 84 C 174 120, 140 160, 90 236Z" fill="#2FD0C0"/><circle cx="90" cy="84" r="52" fill="#061A33"/></svg><div style="position:absolute;left:47px;top:41px">${icon('hospital-symbol',86,'#FFFFFF')}</div>`);
S.ripple=el('scenes',`<svg width="400" height="140" viewBox="-200 -70 400 140">${[0,1].map(i=>`<ellipse id="rp${i}" rx="40" ry="14" fill="none" stroke="#2FD0C0" stroke-width="5"/>`).join('')}</svg>`);
S.locC=el('scenes',`<div class="card" style="position:relative;padding:22px 60px 30px;text-align:center"><div class="lbl" style="font-size:74px">مركز النهضة الطبي</div><div id="locS" style="display:flex;gap:14px;align-items:center;justify-content:center">${icon('geo-location',54,'#2FD0C0')}<div class="sub" style="font-size:54px;color:#2FD0C0">شبين القناطر</div></div></div>`);
// I: diagnosis
S.stepT=el('scenes','<div class="lbl" style="font-size:64px">واحدة.. واحدة</div>');
S.steps=el('scenes',`<svg width="520" height="60" viewBox="0 0 520 60"><line x1="40" y1="30" x2="480" y2="30" stroke="rgba(255,255,255,.18)" stroke-width="8" stroke-linecap="round"/><line id="stl" x1="480" y1="30" x2="480" y2="30" stroke="#2FD0C0" stroke-width="8" stroke-linecap="round"/>${[480,260,40].map((x,i)=>`<circle id="sd${i}" cx="${x}" cy="30" r="24" fill="#0B2A4B" stroke="#2FD0C0" stroke-width="6"/>`).join('')}</svg>`);
S.dStom=el('scenes',icon('stomach-outline',300,'rgba(233,242,248,.85)'));
S.mag=el('scenes',icon('magnifying-glass',170,'#2FD0C0'));
S.dxL=el('scenes',`<div style="display:flex;align-items:center;gap:18px"><svg width="70" height="70" viewBox="0 0 70 70"><circle cx="35" cy="35" r="32" fill="#2FD0C0"/><path id="dxk" d="M20 36 L31 47 L51 25" stroke="#061A33" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="lbl" style="font-size:60px">التشخيص الصح</div></div>`);
// J: tools (full)
const toolCard=(t,n,extra)=>el('scenes',`<div class="card" style="position:relative;width:840px;height:210px;display:flex;align-items:center;gap:34px;padding:0 44px"><div style="position:relative;width:150px;height:150px;border-radius:30px;background:rgba(47,208,192,.12);display:flex;align-items:center;justify-content:center">${icon(n,116,'#2FD0C0')}${extra||''}</div><div class="lbl" style="font-size:60px">${t}</div></div>`);
S.t1=toolCard('أحدث الأجهزة الطبية','ultrasound-scanner',`<svg class="abs" style="left:-30px;top:-10px" width="80" height="80" viewBox="0 0 80 80">${[0,1,2].map(i=>`<path id="us${i}" d="M10 40 A30 30 0 0 1 40 10" stroke="#FFC75A" stroke-width="5" fill="none" stroke-linecap="round"/>`).join('')}</svg>`);
S.t2=toolCard('التحاليل','test-tubes',`<div id="bub" class="abs" style="left:0;top:0;width:150px;height:150px"></div>`);
S.t3=toolCard('الإشاعات','xray',`<div id="scan" class="abs" style="left:14px;width:122px;height:6px;border-radius:6px;background:#FFC75A;box-shadow:0 0 14px #FFC75A"></div>`);
// K: treatment
S.chipA=el('scenes','<div class="tile" style="position:relative;height:130px;padding:0 40px"><div class="t" style="font-size:50px">التشخيص الصح</div></div>');
S.arrow=el('scenes',`<svg width="150" height="50" viewBox="0 0 150 50"><path id="arw" d="M140 25 H 14 M 36 6 L 12 25 L 36 44" stroke="#2FD0C0" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="220" stroke-dashoffset="220"/></svg>`);
S.chipB=el('scenes',`<div class="tile" style="position:relative;height:130px;padding:0 34px;background:rgba(47,208,192,.16);border-color:#2FD0C0">${icon('pills-2',86,'#2FD0C0')}<div class="t" style="font-size:50px">العلاج الصح</div></div>`);
S.check=el('scenes',`<svg width="230" height="230" viewBox="0 0 230 230"><circle cx="115" cy="115" r="100" fill="rgba(47,208,192,.12)"/><circle id="ckc" cx="115" cy="115" r="100" fill="none" stroke="#2FD0C0" stroke-width="10" stroke-dasharray="629" stroke-dashoffset="629" transform="rotate(-90 115 115)" stroke-linecap="round"/><path id="ckm" d="M70 118 L102 150 L162 86" stroke="#2FD0C0" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="150" stroke-dashoffset="150"/></svg>`);
// L: end card
S.endLogo=el('scenes','<img src="logo.png" style="width:960px;border-radius:34px;display:block">');
S.endLoc=el('scenes',`<div style="display:flex;gap:16px;align-items:center">${icon('geo-location',60,'#2FD0C0')}<div class="sub" style="font-size:52px">مركز النهضة الطبي · شبين القناطر</div></div>`);

const ALL=Object.values(S).flat();

// ---------------- per-frame render ----------------
function render(t){
  ALL.forEach(d=>{d.style.opacity=0;d.style.display='none'});
  const P=panelState(t);
  const pn=$('panel');pn.style.height=P.bottom+'px';pn.style.opacity=P.op;
  pn.style.borderRadius=P.bottom>=1919?'0':'0 0 40px 40px';
  const eg=$('edge');const showEdge=P.bottom>20&&P.bottom<1900;eg.style.top=(P.bottom-3)+'px';eg.style.opacity=showEdge?Math.min(1,P.bottom/200)*P.op:0;
  let any=P.bottom>1||false;

  // A acid 1.55-4.12
  if(t>1.5&&t<4.2){const pushA=eio(seg(t,3.72,4.12));const dx=pushA*1080;
    const a=back(seg(t,1.75,2.2));put(S.stom,540+dx,450,.6+.4*a,seg(t,1.75,1.95));
    const fa=seg(t,1.95,2.3);put(S.flames,540+dx,250,fa,fa);
    for(let i=0;i<3;i++){const f=document.getElementById('fl'+i);f.setAttribute('transform',`translate(${60+i*70},200) scale(${.8+.18*Math.sin(t*13+i*2)},${.85+.2*Math.sin(t*9+i)})`)}
    const hp=(t*1.6)%1;put(S.heat,540+dx,170-hp*40,1,fa*(1-hp)*.9);
    put(S.acidL,540+dx,110,1,seg(t,1.85,2.1));S.acidL.style.transform+=` translateY(${(1-eout(seg(t,1.85,2.15)))*-30}px)`;}
  // B IBS 3.72-4.75
  if(t>3.72&&t<4.8){const p=eio(seg(t,3.72,4.12));const dx=(1-p)*-1080;const o=1-seg(t,4.6,4.78);
    put(S.colon,540+dx,450,1,o);put(S.spasm,540+dx,450,1,o*(.55+.45*Math.sin(t*20)));put(S.ibsL,540+dx,110,1,o);}
  // C pain 6.25-9.1 (full)
  if(t>6.3&&t<9.15){const o=seg(t,6.55,6.85);const a=back(seg(t,6.55,7.0));
    put(S.painFig,540,1010,.85+.15*a,o);put(S.rings,540,1060,1,o);
    for(let i=0;i<3;i++){const ph=((t-6.6)/1.3+i/3)%1;const c=document.getElementById('rg'+i);c.setAttribute('r',40+ph*230);c.setAttribute('opacity',(1-ph)*.9)}
    document.getElementById('rgc').setAttribute('r',40+8*Math.sin(t*8));
    put(S.painW,380,420,.7+.3*back(seg(t,6.45,6.85)),seg(t,6.45,6.7));
    put(S.painSub,380,560,1,seg(t,7.85,8.1));S.painSub.style.transform+=` translateY(${(1-eout(seg(t,7.85,8.15)))*20}px)`;}
  // D strike card 9.6-11.95 (speaker mode, above head)
  if(t>9.55&&t<12.0){const o=env(t,9.6,11.95,.3,.3);put(S.strike,540,300,.94+.06*eout(seg(t,9.6,9.95)),o);
    document.getElementById('strk').style.width=(480*eio(seg(t,10.3,10.7)))+'px';any=true;}
  // E clinic 12.3-15.85
  if(t>12.3&&t<15.85){const o=1-seg(t,15.6,15.82);put(S.clinicH,540,135,1,Math.min(o,seg(t,12.4,12.7)));
    S.people.forEach((d,i)=>{const r=Math.floor(i/5),c=i%5;const ta=12.6+i*.09;const a=back(seg(t,ta,ta+.35));
      put(d,540+(2-c)*165,330+r*150+Math.sin(t*2+i)*3,.4+.6*a,Math.min(o,seg(t,ta,ta+.15)))});}
  // F daily life 15.9-21.0 (full)
  if(t>15.9&&t<21.05){const o=1-seg(t,20.75,21.0);
    put(S.dayT,400,420,1,Math.min(o,seg(t,17.3,17.6)));document.getElementById('dayU').style.width=(360*eout(seg(t,17.45,17.9)))+'px';
    const wx=lerp(1300,-250,seg(t,17.35,18.0));put(S.wave,wx,950,1,Math.min(o,(t>17.35&&t<18.0)?1:0));
    S.tiles.forEach((d,i)=>{const ta=15.95+i*.2;const a=back(seg(t,ta,ta+.35));const x=850-i*310;
      const hit=t>17.35+(1300-x)/1550*.65;const sh=hit?Math.sin((t-17.4)*40)*6*Math.max(0,1-(t-17.5)*2):0;
      const sh2=(t>19.25&&t<19.7)?Math.sin(t*45)*5:0;
      put(d,x+sh+sh2,950,(.5+.5*a)*(t>19.25?1+.04*Math.sin((t-19.25)*6):1),Math.min(o,seg(t,ta,ta+.15)));
      const b=d.querySelector('.bdg');const ba=hit?back(seg(t,17.45+i*.15,17.8+i*.15)):0;b.style.transform=`scale(${ba})`;
      d.firstElementChild.style.borderColor=hit?'#FF6A55':'#2FD0C0';d.querySelector('svg').style.opacity=hit?.55:1;});}
  // G logo (speaker) 24.0-25.85 then moves into panel 25.85-29.4
  if(t>24.0&&t<29.45){const o=Math.min(seg(t,24.05,24.4),1-seg(t,29.2,29.4));const m=eio(seg(t,25.85,26.35));
    put(S.logo,540,lerp(350,150,m)+(1-eout(seg(t,24.05,24.45)))*30,lerp(1,.82,m),o);any=true;
    S.specs.forEach((d,i)=>{const ta=[26.0,26.85,27.95,28.65][i];const a=back(seg(t,ta,ta+.35));
      put(d,i%2===0?778:302,i<2?400:600,.6+.4*a,Math.min(1-seg(t,29.2,29.4),seg(t,ta,ta+.15)))});}
  // H location 33.4-37.55 (full)
  if(t>33.4&&t<37.6){const o=1-seg(t,37.3,37.55);put(S.map,540,960,1.15-.15*eout(seg(t,33.4,37.4)),Math.min(o,seg(t,33.45,33.9)));
    const d=bounce(seg(t,33.9,34.45));put(S.pin,540,lerp(-200,820,d),1,Math.min(o,seg(t,33.9,34.0)));
    for(let i=0;i<2;i++){const ph=((t-34.4)/1.1+i/2)%1;const e=document.getElementById('rp'+i);e.setAttribute('rx',30+ph*170);e.setAttribute('ry',10+ph*56);e.setAttribute('opacity',t>34.4?(1-ph):0)}
    put(S.ripple,540,935,1,o);
