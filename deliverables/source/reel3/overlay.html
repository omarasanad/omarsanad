<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:CXB;src:url(fonts/Cairo-ExtraBold.ttf)}
@font-face{font-family:CSB;src:url(fonts/Cairo-SemiBold.ttf)}
:root{--navy:#061A33;--teal:#2FD0C0;--coral:#FF6A55;--ink:#E9F2F8;--gold:#FFC75A}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
*{box-sizing:border-box}
#panel{position:absolute;left:0;top:0;width:1080px;height:0;overflow:hidden;border-radius:0 0 40px 40px;background:radial-gradient(120% 60% at 50% 0%,#0F3560 0%,var(--navy) 60%),var(--navy)}
#dots{position:absolute;inset:0;background-image:radial-gradient(rgba(47,208,192,.10) 2px,transparent 2.5px);background-size:44px 44px}
#edge{position:absolute;left:60px;width:960px;height:5px;border-radius:5px;background:var(--teal);box-shadow:0 0 18px rgba(47,208,192,.7)}
.abs{position:absolute}
.lbl{font-family:CXB;color:#fff;white-space:nowrap;line-height:1.25}
.sub{font-family:CSB;color:var(--ink);white-space:nowrap;line-height:1.3}
.chip{padding:8px 34px 14px;border-radius:999px;font-family:CXB;font-size:50px;color:#fff;white-space:nowrap}
.card{position:absolute;border-radius:30px;background:rgba(6,26,51,.9);border:2px solid rgba(47,208,192,.35);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.tile{position:absolute;border-radius:34px;background:rgba(255,255,255,.06);border:3px solid rgba(47,208,192,.55);display:flex;align-items:center;gap:20px;padding:0 30px}
.tile .t{font-family:CXB;font-size:44px;color:#fff;white-space:nowrap}
svg{overflow:visible}
</style></head>
<body>
<div id="panel"><div id="dots"></div><div id="sc"></div></div><div id="edge"></div><div id="free"></div>
<script src="timeline.js"></script><script src="icons.js"></script>
<script>
const $=id=>document.getElementById(id), q=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(t,a,b)=>clamp((t-a)/(b-a));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eout=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;
function icon(n,s,c){const i=ICONS[n];return `<svg width="${s}" height="${s*i.h/i.w}" viewBox="0 0 ${i.w} ${i.h}" style="color:${c};display:block">${i.body}</svg>`}
function el(html,parent='sc'){const d=document.createElement('div');d.className='abs';d.innerHTML=html;$(parent).appendChild(d);return d}
function put(d,x,y,sc=1,op=1,rot=0){if(op<=0.001){d.style.display='none';return}
  d.style.left='0px';d.style.top='0px';d.style.display='block';const w=d.offsetWidth,h=d.offsetHeight;
  d.style.transform=`translate(${x-w/2}px,${y-h/2}px) scale(${sc}) rotate(${rot}deg)`;d.style.opacity=op}
function panelState(t){const M=TL.modes;let bottom=TL.panel[M[0][1]],op=1;
  for(let i=1;i<M.length;i++){const [s,m,d,k]=M[i];const prev=TL.panel[M[i-1][1]];if(t<s)break;const p=eio(seg(t,s,s+d));
    if(k==='dissolve'&&m==='S'){bottom=prev;op=1-p;if(p>=1){bottom=0;op=1}}else{bottom=lerp(prev,TL.panel[m],p);op=1}}
  return {bottom,op}}
const GLASS=(w)=>`<svg width="${w}" height="${w*1.45}" viewBox="0 0 200 290"><defs><clipPath id="gc${w}"><path d="M30 20 L170 20 L152 270 Q150 282 138 282 L62 282 Q50 282 48 270Z"/></clipPath></defs>
 <rect class="milk" x="0" y="80" width="200" height="220" fill="#F7F4EC" clip-path="url(#gc${w})"/><path d="M30 20 L170 20 L152 270 Q150 282 138 282 L62 282 Q50 282 48 270Z" fill="rgba(255,255,255,.08)" stroke="#E9F2F8" stroke-width="8" stroke-linejoin="round"/></svg>`;
// custom stomach (600x700 box)
const SPATH="M255 0 L255 115 C255 165 215 190 185 240 C130 330 112 440 170 535 C240 645 410 668 510 595 C572 550 588 470 548 428 C516 396 470 404 448 438 C418 488 342 500 304 450 C270 408 296 330 326 262 C348 212 334 168 322 118 L322 0 Z";
const STOM=`<svg width="600" height="700" viewBox="0 0 600 700"><defs><clipPath id="sclip"><path d="${SPATH}"/></clipPath>
 <radialGradient id="acid" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#FF6A55" stop-opacity=".55"/><stop offset="1" stop-color="#FF6A55" stop-opacity="0"/></radialGradient></defs>
 <path id="sbody" d="${SPATH}" fill="#123B63" stroke="#2FD0C0" stroke-width="10" stroke-linejoin="round"/>
 <g clip-path="url(#sclip)"><rect id="pool" x="0" y="700" width="600" height="400" fill="#F7F4EC" opacity=".92"/>
   <rect id="acidglow" x="0" y="0" width="600" height="700" fill="url(#acid)" opacity="0"/>
   <g id="parts"></g><g id="acids"></g><g id="drops"></g></g>
 <path id="coat" d="${SPATH}" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round" opacity=".95" clip-path="url(#sclip)"/>
</svg>`;
const S={};
// --- intro question (split)
S.qchip=el('<div class="chip" style="background:rgba(47,208,192,.16);border:3px solid #2FD0C0">سؤال</div>');
S.glass=el(GLASS(190));
S.qst=el(`<div style="position:relative">${icon('stomach',260,'#2FD0C0')}<svg class="abs" style="left:70px;top:-90px" width="140" height="120" viewBox="0 0 140 120">${[0,1,2].map(i=>`<path class="fl" d="M0,0 C-22,-30 -15,-60 0,-95 C6,-70 25,-60 21,-30 C19,-15 10,-4 0,0Z" fill="#FF8A3D" transform="translate(${25+i*45},115)"/>`).join('')}</svg></div>`);
S.qmark=el('<div class="lbl" style="font-size:230px;color:#FFC75A">؟</div>');
// --- myth card (speaker)
S.myth=el(`<div class="card" style="position:relative;width:820px;height:200px;display:flex;align-items:center;justify-content:center"><div class="lbl" style="font-size:66px">اللبن بيهدّي الحموضة؟</div>
 <div id="stamp" class="abs" style="left:190px;top:42px;width:440px;text-align:center;white-space:nowrap;line-height:1.2;padding:2px 0 10px;border:8px solid #FF6A55;border-radius:22px;font-family:CXB;font-size:66px;color:#FF6A55;background:rgba(6,26,51,.9);transform:rotate(-6deg)">مش مظبوطة</div></div>`,'free');
// --- stomach diagram (full)
S.dglass=el(GLASS(150));
S.stom=el(STOM);
const callout=(t,c)=>el(`<div class="chip" style="background:rgba(6,26,51,.85);border:3px solid ${c};font-size:46px">${t}</div>`);
S.cCoat=callout('طبقة بتغلّف المعدة','#F7F4EC');
S.cFat=callout('<span style="color:#FFC75A">●</span> دهون','#FFC75A');
S.cCa=callout('<span style="color:#9FE8F0">●</span> كالسيوم','#9FE8F0');
S.cAcid=callout('<span style="color:#FF6A55">▲</span> إفراز الحمض','#FF6A55');
S.coatLine=el('<svg width="200" height="10" viewBox="0 0 200 10"><line x1="0" y1="5" x2="200" y2="5" stroke="#F7F4EC" stroke-width="5" stroke-dasharray="10 10"/></svg>');
// --- rebound chart (split)
S.rTitle=el('<div class="lbl" dir="ltr" style="font-size:64px;font-family:CXB">Rebound Hyperacidity</div>');
S.rSub=el('<div class="sub" style="font-size:42px;color:#2FD0C0">الحموضة الارتدادية</div>');
S.chart=el(`<svg width="900" height="470" viewBox="0 0 900 470">
 <line x1="60" y1="420" x2="860" y2="420" stroke="rgba(255,255,255,.35)" stroke-width="5"/><path d="M60 420 l22 -12 v24z" fill="rgba(255,255,255,.5)"/>
 <line x1="860" y1="40" x2="860" y2="420" stroke="rgba(255,255,255,.35)" stroke-width="5"/>
 <line x1="80" y1="240" x2="840" y2="240" stroke="rgba(255,255,255,.35)" stroke-width="4" stroke-dasharray="14 12"/>
 <path id="curve" d="M840 240 L700 240 C640 240 620 360 560 360 C500 360 470 330 430 280 C380 210 330 110 250 100 C180 92 140 110 90 115" fill="none" stroke="#2FD0C0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
 <path id="hot" d="M430 280 C380 210 330 110 250 100 C180 92 140 110 90 115" fill="none" stroke="#FF6A55" stroke-width="12" stroke-linecap="round"/>
 <circle id="mDot" cx="700" cy="240" r="16" fill="#F7F4EC"/></svg>`);
S.yLbl=el('<div class="sub" style="font-size:38px">الحموضة</div>');
S.xLbl=el('<div class="sub" style="font-size:36px;color:rgba(233,242,248,.7)">الوقت</div>');
S.base=el('<div class="sub" style="font-size:32px;color:rgba(233,242,248,.75)">قبل</div>');
S.mLbl=el('<div class="chip" style="background:#F7F4EC;color:#061A33;font-size:38px;padding:4px 24px 10px">اللبن</div>');
S.relief=el('<div class="sub" style="font-size:36px;color:#2FD0C0">راحة مؤقتة</div>');
S.more=el('<div class="chip" style="background:rgba(255,106,85,.18);border:3px solid #FF6A55;font-size:42px">أكتر من الأول</div>');
// --- warning card (speaker)
S.warn=el(`<div class="card" style="position:relative;padding:20px 50px 28px;display:flex;align-items:center;gap:22px;border-color:#FFC75A">${icon('alert-triangle',90,'#FFC75A')}<div class="lbl" style="font-size:70px">خلّي بالك</div></div>`,'free');
// --- persistent / alarm / checkup (full)
S.days=[0,1,2,3,4,5,6].map(i=>el(`<div style="width:104px;height:124px;border-radius:22px;background:rgba(255,255,255,.06);border:3px solid rgba(255,106,85,.6);display:flex;align-items:center;justify-content:center"><svg width="56" height="80" viewBox="-28 -95 56 100"><path d="M0,0 C-22,-30 -15,-60 0,-95 C6,-70 25,-60 21,-30 C19,-15 10,-4 0,0Z" fill="#FF8A3D"/></svg></div>`));
S.alarmSt=el(`<div style="position:relative">${icon('stomach',330,'#2FD0C0')}<div id="alB" class="abs" style="left:-40px;top:-30px">${icon('alert-triangle',140,'#FFC75A')}</div></div>`);
S.alRings=el(`<svg width="700" height="700" viewBox="-350 -350 700 700">${[0,1,2].map(i=>`<circle id="ar${i}" r="100" fill="none" stroke="#FFC75A" stroke-width="7"/>`).join('')}</svg>`);
S.alL=el('<div class="chip" style="background:rgba(255,199,90,.16);border:3px solid #FFC75A">إنذار</div>');
S.doc=el(`<div style="display:flex;align-items:center;gap:24px"><div style="width:200px;height:200px;border-radius:50%;background:#0B2A4B;border:6px solid #2FD0C0;display:flex;align-items:center;justify-content:center">${icon('stethoscope',120,'#2FD0C0')}</div>
 <svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="#2FD0C0"/><path id="dck" d="M32 62 L52 82 L88 40" stroke="#061A33" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="90" stroke-dashoffset="90"/></svg></div>`);
// --- root cause (split)
S.dStom=el(icon('stomach-outline',300,'rgba(233,242,248,.85)'));
S.mag=el(icon('magnifying-glass',170,'#2FD0C0'));
S.cause=el(`<div style="display:flex;align-items:center;gap:18px"><svg width="70" height="70" viewBox="0 0 70 70"><circle cx="35" cy="35" r="32" fill="#2FD0C0"/><path id="cck" d="M20 36 L31 47 L51 25" stroke="#061A33" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60"/></svg><div class="lbl" style="font-size:62px">السبب الرئيسي</div></div>`);
// --- logo + specialties
S.logo=el('<img src="logo.png" style="width:900px;border-radius:34px;display:block;box-shadow:0 20px 50px rgba(0,0,0,.35)">','free');
S.specs=[['الباطنة','internal-medicine'],['الجهاز الهضمي','stomach'],['الكبد','liver'],['المناظير','endo']].map(([t,n])=>el(`<div class="tile" style="position:relative;width:484px;height:160px">${n==='endo'?`<svg width="100" height="100" viewBox="0 0 100 100"><path d="M18 14 C 70 6, 88 30, 70 52 S 30 78, 64 90" stroke="#2FD0C0" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="64" cy="90" r="8" fill="#FFC75A"/><circle cx="64" cy="90" r="15" fill="#FFC75A" opacity=".3"/><rect x="4" y="6" width="22" height="16" rx="5" fill="#2FD0C0"/></svg>`:icon(n,100,'#2FD0C0')}<div class="t">${t}</div></div>`));
S.endLogo=el('<img src="logo.png" style="width:960px;border-radius:34px;display:block">');
S.endLoc=el(`<div style="display:flex;gap:16px;align-items:center">${icon('geo-location',60,'#2FD0C0')}<div class="sub" style="font-size:52px">مركز النهضة الطبي · شبين القناطر</div></div>`);
const ALL=Object.values(S).flat();
// particles inside stomach (deterministic)
let pr=7;const R=()=>(pr=(pr*16807)%2147483647)/2147483647;
const FAT=[...Array(14)].map(()=>({x:180+R()*330,y:470+R()*150,r:9+R()*9,ph:R()*6}));
const CA=[...Array(12)].map(()=>({x:180+R()*330,y:470+R()*150,ph:R()*6}));
const AC=[...Array(26)].map(()=>({a:R(),sp:.5+R()*.7,ph:R()}));
const WALL=[[200,330],[175,430],[200,520],[270,590],[380,615],[480,580],[525,470],[300,300],[310,400],[330,470]];

function render(t){
  ALL.forEach(d=>d.style.display='none');
  const P=panelState(t);const pn=$('panel');pn.style.height=P.bottom+'px';pn.style.opacity=P.op;pn.style.borderRadius=P.bottom>=1919?'0':'0 0 40px 40px';
  const eg=$('edge');eg.style.top=(P.bottom-3)+'px';eg.style.opacity=(P.bottom>20&&P.bottom<1900)?Math.min(1,P.bottom/200)*P.op:0;
  $('dots').style.backgroundPosition=`${-t*14}px ${t*22}px`;
  // intro question 1.3-5.3 (split)
  if(t>1.3&&t<5.4){const o=1-seg(t,5.1,5.35);put(S.qchip,540,110,1,Math.min(o,seg(t,1.35,1.6)));
    put(S.glass,250,450,.7+.3*back(seg(t,1.4,1.75)),Math.min(o,seg(t,1.4,1.55)),-4+3*Math.sin(t*1.5));
    put(S.qst,830,470,.7+.3*back(seg(t,1.7,2.05)),Math.min(o,seg(t,1.7,1.85)));
    document.querySelectorAll('.fl').forEach((f,i)=>f.setAttribute('transform',`translate(${25+i*45},115) scale(${.8+.18*Math.sin(t*13+i*2)},${.85+.2*Math.sin(t*9+i)})`));
    put(S.qmark,545,450,(.6+.4*back(seg(t,2.2,2.55)))*(1+.06*Math.sin(t*4)),Math.min(o,seg(t,2.2,2.35)));}
  // myth card 6.9-10.15 (speaker)
  if(t>6.9&&t<10.3){const o=Math.min(seg(t,6.95,7.3),1-seg(t,9.95,10.2));put(S.myth,540,300,.94+.06*eout(seg(t,6.95,7.3)),o);
    const sp=seg(t,9.12,9.32);const st=$('stamp');st.style.opacity=sp>0?1:0;st.style.transform=`rotate(-6deg) scale(${lerp(2.2,1,eout(sp))})`;}
  // stomach diagram 10.4-22.5 (full)
  if(t>10.4&&t<22.55){const o=1-seg(t,22.3,22.55);const ox=470,oy=930;
    put(S.stom,ox,oy-8*Math.sin(t*1.3),(.85+.15*eout(seg(t,10.45,10.9)))*(1+.025*Math.sin(t*1.7)),Math.min(o,seg(t,10.45,10.75)));
    // milk glass pours 10.6-11.9
    const pour=seg(t,10.7,11.6);put(S.dglass,ox-200,oy-430,1,Math.min(o,seg(t,10.5,10.7),1-seg(t,12.0,12.3)),lerp(0,55,eio(seg(t,10.6,10.9))));
    S.dglass.querySelector('.milk').setAttribute('y',80+180*pour);
    // drops down esophagus
    let dh='';if(t>10.8&&t<11.9)for(let i=0;i<6;i++){const ph=((t-10.8)*1.8+i/6)%1;dh+=`<circle cx="${288+Math.sin(i)*8}" cy="${ph*420}" r="14" fill="#F7F4EC"/>`}$('drops').innerHTML=dh;
    const lvl=lerp(700,500,eio(seg(t,11.0,12.0)));$('pool').setAttribute('y',lvl+6*Math.sin(t*2.2));
    // coating draws 11.6-13.0, fades 15.9-17.3
    const L=2300;const c=$('coat');c.setAttribute('stroke-dasharray',L);c.setAttribute('stroke-dashoffset',L*(1-eio(seg(t,11.6,13.0))));c.setAttribute('opacity',.95*(1-seg(t,15.9,17.3)));
    put(S.cCoat,470,1290,1,Math.min(o,seg(t,12.0,12.3),1-seg(t,15.9,16.4)));
    // fat & calcium 17.4-
    let ph='';const fa=seg(t,17.45,17.9),ca=seg(t,18.3,18.8);
    FAT.forEach(p=>ph+=`<circle cx="${p.x+6*Math.sin(t*1.5+p.ph)}" cy="${p.y+5*Math.cos(t*1.3+p.ph)}" r="${p.r*fa}" fill="#FFC75A" opacity=".95"/>`);
    CA.forEach(p=>ph+=`<g transform="translate(${p.x+6*Math.cos(t*1.4+p.ph)},${p.y+5*Math.sin(t*1.2+p.ph)}) scale(${ca})"><circle r="17" fill="#9FE8F0"/><text y="7" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="#061A33">Ca</text></g>`);
    $('parts').innerHTML=ph;
    put(S.cFat,250,oy-330,1,Math.min(o,seg(t,17.45,17.7)));put(S.cCa,250,oy-245,1,Math.min(o,seg(t,18.3,18.55)));
    // acid secretion 19.7-
    const ac=seg(t,19.7,22.2);let ah='';
    AC.forEach((p,i)=>{if(ac<=0||i/AC.length>ac*1.05)return;const w=WALL[i%WALL.length];const k=((t*p.sp)+p.ph)%1;
      ah+=`<path d="M0,-14 C9,-2 9,8 0,10 C-9,8 -9,-2 0,-14Z" fill="#FF6A55" transform="translate(${lerp(w[0],420,k*.55)},${lerp(w[1],520,k*.55)}) scale(${1.1-k*.5})" opacity="${1-k*.6}"/>`});
    $('acids').innerHTML=ah;$('acidglow').setAttribute('opacity',ac*.9);
    $('sbody').setAttribute('stroke',ac>0.2?'#FF6A55':'#2FD0C0');
    put(S.cAcid,265,770,.8+.2*back(seg(t,19.7,20.0)),Math.min(o,seg(t,19.7,19.9)));}
  // rebound chart 22.6-29.65 (split)
  if(t>22.6&&t<29.7){const o=1-seg(t,29.45,29.68);
    put(S.rTitle,540,95,1,Math.min(o,seg(t,24.15,24.45)));put(S.rSub,540,165,1,Math.min(o,seg(t,24.4,24.7)));
    put(S.chart,540,460,1,Math.min(o,seg(t,22.65,22.95)));put(S.yLbl,990,250,1,Math.min(o,seg(t,22.7,23.0)));put(S.xLbl,170,700,1,Math.min(o,seg(t,22.7,23.0)));
    put(S.base,960+0,470,1,Math.min(o,seg(t,22.8,23.1)));
    const cv=$('curve');const L=1150;cv.setAttribute('stroke-dasharray',L);cv.setAttribute('stroke-dashoffset',L*(1-eio(seg(t,22.9,27.8))));
    const hv=$('hot');hv.setAttribute('stroke-dasharray',520);hv.setAttribute('stroke-dashoffset',520*(1-eio(seg(t,25.9,27.8))));
    $('mDot').setAttribute('opacity',seg(t,23.2,23.4));
    put(S.mLbl,790,355,1,Math.min(o,seg(t,23.2,23.45)));
    put(S.relief,500,595,1,Math.min(o,seg(t,24.0,24.3)));
    put(S.more,300,215,.7+.3*back(seg(t,28.42,28.75)),Math.min(o,seg(t,28.42,28.6)));}
  // warning card 29.7-31.0 (speaker)
  if(t>29.7&&t<31.0){put(S.warn,540,300,.8+.2*back(seg(t,29.72,30.05)),Math.min(seg(t,29.72,29.9),1-seg(t,30.75,30.95)));}
  // persistent / alarm / check 31.0-37.0 (full)
  if(t>31.0&&t<37.05){const o=1-seg(t,36.8,37.05);
    const dfade=1-seg(t,32.3,32.6)*.6;
    S.days.forEach((d,i)=>{const ta=31.0+i*.2;put(d,900-i*126,lerp(720,560,eio(seg(t,32.3,32.7))),.6+.4*back(seg(t,ta,ta+.3)),Math.min(o,seg(t,ta,ta+.12))*dfade)});
    const al=seg(t,32.35,32.7);put(S.alarmSt,lerp(540,370,eio(seg(t,34.5,34.9))),1010+8*Math.sin(t*1.4),(.7+.3*back(al))*(1+.02*Math.sin(t*1.9)),Math.min(o,al));
    $('alB').style.transform=`scale(${back(seg(t,32.5,32.85))*(1+.08*Math.sin(t*9))})`;
    for(let i=0;i<3;i++){const ph=((t-32.4)/1.2+i/3)%1;const c=$('ar'+i);c.setAttribute('r',120+ph*220);c.setAttribute('opacity',t>32.4&&t<34.6?(1-ph)*.8:0)}
    put(S.alRings,lerp(540,370,eio(seg(t,34.5,34.9))),1010,1,o);
    put(S.alL,540,1270,1,Math.min(o,seg(t,32.6,32.85),1-seg(t,34.4,34.6)));
