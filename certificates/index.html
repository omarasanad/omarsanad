<body data-page="certificates">

<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header-mount"></div>

<main id="main">

  <section class="page-hero">
    <div class="container">
      <p class="eyebrow reveal">Achievements</p>
      <h1 class="page-title reveal">Certificates</h1>
      <p class="lede reveal">10 professional certifications across smart buildings, industrial automation, and continued professional development — earned alongside my academic and industry work.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">

      <div class="cert-toolbar reveal">
        <div class="cert-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
          <input type="search" id="cert-search-input" placeholder="Search certificates, organizations, or skills…" aria-label="Search certificates">
        </div>
        <div class="cert-sort">
          <label for="cert-sort-select">Sort by</label>
          <select id="cert-sort-select">
            <option value="newest" selected>Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="org">Organization</option>
          </select>
        </div>
      </div>

      <div class="filter-bar reveal" id="cert-filter-bar" role="group" aria-label="Filter certificates by category">
        <button type="button" class="filter-pill active" data-filter="all">All</button>
        <button type="button" class="filter-pill" data-filter="smart-buildings-knx">Smart Buildings &amp; KNX</button>
        <button type="button" class="filter-pill" data-filter="professional-programs-internships">Professional Programs &amp; Internships</button>
        <button type="button" class="filter-pill" data-filter="online-training">Online Training</button>
        <button type="button" class="filter-pill" data-filter="industrial-automation">Industrial Automation</button>
        <button type="button" class="filter-pill" data-filter="professional-development">Professional Development</button>
      </div>

      <div id="cert-container"></div>

      <div class="cert-empty" id="cert-empty">
        <p>No certificates match your search.</p>
      </div>

    </div>
  </section>

</main>

<!-- CERTIFICATE MODAL (populated dynamically) -->
<div class="modal-overlay" id="cert-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="cert-modal-title">
  <div class="modal-box">
    <button type="button" class="modal-close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
    </button>
    <div class="cert-modal-head">
      <span class="org-badge" id="cert-modal-badge"></span>
      <h3 id="cert-modal-title"></h3>
    </div>
    <p class="cert-modal-org" id="cert-modal-org"></p>
    <p class="cert-modal-date" id="cert-modal-date"></p>
    <div id="cert-modal-preview-slot"></div>
    <p class="cert-modal-desc" id="cert-modal-desc"></p>
    <div class="cert-modal-skills">
      <h4>Skills Gained</h4>
      <div class="tag-pills" id="cert-modal-skills"></div>
    </div>
    <a class="btn btn-primary btn-sm" id="cert-modal-download" download>Download PDF</a>
  </div>
</div>
