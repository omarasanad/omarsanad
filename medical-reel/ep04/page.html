<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Ep04 Initiative</title>
<style>
@font-face{font-family:Cairo;font-weight:500;src:url(fonts/cairo-arabic-500-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Cairo;font-weight:800;src:url(fonts/cairo-arabic-800-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Cairo;font-weight:900;src:url(fonts/cairo-arabic-900-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Cairo;font-weight:800;src:url(fonts/cairo-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{--navy:#0B1F3A;--navy2:#071629;--teal:#14B8A6;--cyan:#3FE0D0;--orange:#FF9F45}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--navy2);font-family:Cairo;color:#fff}
.abs{position:absolute}
#bgfill{inset:0;background:radial-gradient(900px 700px at 50% 30%, #12345c, var(--navy2) 75%)}
#vid{left:0;top:210px;width:1080px;height:1500px;overflow:hidden}
#vid img{width:1080px;height:1500px;display:block;transform-origin:50% 30%}
#vid:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom, rgba(7,22,41,.55), rgba(7,22,41,0) 14%, rgba(7,22,41,0) 52%, rgba(7,22,41,.88) 88%, rgba(7,22,41,.96))}
#hdr{left:0;right:0;top:0;height:210px;background:linear-gradient(to bottom, var(--navy2), var(--navy) 85%);border-bottom:3px solid var(--teal)}
.lock{left:56px;top:52px;display:flex;align-items:center;gap:22px;direction:ltr}
.lock img{width:108px;height:108px;border-radius:50%;box-shadow:0 0 0 3px rgba(63,224,208,.5)}
.lock .t{direction:rtl;text-align:left}
.lock .nm{font-weight:900;font-size:40px;line-height:1.2}
.lock .sp{font-weight:700;font-size:24px;color:var(--cyan);line-height:1.3}
.kick{right:56px;top:74px;font-weight:800;font-size:30px;color:var(--navy2);background:var(--cyan);padding:8px 26px 10px;border-radius:999px;white-space:nowrap}
.cap{left:60px;right:60px;top:1586px;text-align:center;font-weight:800;font-size:54px;line-height:1.45;text-shadow:0 3px 14px rgba(0,0,0,.6)}
.cap .w{display:inline-block;transition:none}
.cap .on{color:var(--cyan)}
.card{right:56px;bottom:400px;width:700px;padding:28px 34px 30px;border-radius:30px;background:rgba(7,22,41,.86);border:2px solid rgba(63,224,208,.55);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.card h3{font-weight:900;font-size:50px;color:#fff;line-height:1.2}
.card h3 span{color:var(--orange)}
.row{display:flex;align-items:center;gap:20px;margin-top:20px;font-weight:800;font-size:36px}
.row .ic{width:62px;height:62px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;flex:none}
.bar{left:0;top:207px;height:6px;background:linear-gradient(90deg,var(--orange),var(--cyan))}
#outro{inset:0;background:radial-gradient(1000px 1100px at 50% 40%, #12345c, var(--navy2) 72%)}
.fb{display:inline-flex;align-items:center;gap:18px;padding:14px 42px 14px 18px;border-radius:999px;background:#fff;color:var(--navy);direction:ltr;white-space:nowrap}
</style>
</head>
<body>
<div id="bgfill" class="abs"></div>
<div id="vid" class="abs"><img id="frame" alt=""></div>
<div id="ov" class="abs" style="inset:0"></div>
<div id="hdr" class="abs"><div class="lock abs"><img src="brand_mark.png" alt=""><div class="t"><div class="nm">د. أبو بكر أحمد سند</div><div class="sp">أخصائي الجهاز الهضمي والكبد والمناظير</div></div></div><div id="kick" class="kick abs"></div></div>
<div id="bar" class="abs bar"></div>
<div id="outro" class="abs" style="opacity:0"></div>
<script>
const VDUR = 29.5, OUTRO = 3.7, TOTAL = VDUR + OUTRO, NF = 885;
window.DURATION = TOTAL;
// caption lines on the speech regions (words spread by length inside each line)
const LINES = [
  [0.95, 4.45, 'ناس كتير بتستحمل الوجع…'],
  [5.30, 6.95, 'وللأسف مش عايزة تكشف.'],
  [7.55, 9.05, 'أنا الدكتور أبو بكر أحمد سند،', ['أبو', 'بكر', 'أحمد', 'سند،']],
  [9.75, 13.10, 'أخصائي الباطنة والجهاز الهضمي والكبد والمناظير.'],
  [13.45, 15.10, 'وللأسف بتقابلني حالات كتير'],
  [15.75, 17.45, 'بتضطر إنها تستحمل الوجع'],
  [17.65, 19.55, 'لأنها مش معاها حق الكشف.', ['حق', 'الكشف.']],
  [19.85, 22.45, 'عشان كده قررنا نعمل مبادرة صغيرة', ['مبادرة', 'صغيرة']],
  [22.65, 26.20, 'لأهالينا، بالتعاون مع مركز النهضة الطبي', ['مركز', 'النهضة', 'الطبي']],
  [26.45, 29.35, 'لعمل كشف باطني…', ['كشف', 'باطني…']],
].map(([a, b, text, hl = []]) => { const ws = text.split(' '); const L = ws.reduce((s, w) => s + w.length + 1, 0); let acc = 0;
  return { a, b, hl, words: ws.map(w => { const s = a + (b - a) * acc / L; acc += w.length + 1; return { w, s }; }) }; });
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), eo = u => 1 - Math.pow(1 - clamp(u), 3);
const fin = (t, a, d = .45) => eo((t - a) / d);
const icon = { hand: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#071629" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-9.3-9A5 5 0 0 1 12 6.5 5 5 0 0 1 21.3 12C19 16.6 12 21 12 21z"/></svg>',
  center: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#071629" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M12 9v6M9 12h6"/></svg>',
  steth: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#071629" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v6a4 4 0 0 0 8 0V3"/><path d="M10 13v3a4 4 0 0 0 8 0v-2"/><circle cx="18" cy="12" r="2"/></svg>' };
const $ = id => document.getElementById(id);
window.seek = async t => {
  t = Number(t);
  const v = t < VDUR;
  // video frame + slow push-in
  const f = Math.min(NF, Math.floor(t * 30) + 1); const img = $('frame');
  const src = 'build/frames/' + String(f).padStart(4, '0') + '.jpg';
  if (v && !img.src.endsWith(src)) { img.src = src; await img.decode().catch(() => 0); }
  img.style.transform = `scale(${1 + .045 * clamp(t / VDUR)})`;
  // kicker: changes when he announces the initiative
  $('kick').textContent = t < 19.8 ? 'رسالة من الدكتور' : 'مبادرة لأهالينا';
  $('bar').style.width = (1080 * clamp(t / TOTAL)) + 'px';
  let o = '';
  // caption
  let cap = null; for (const c of LINES) if (t >= c.a - .08 && t < c.b + .35) cap = c;
  if (v && cap) { const a = Math.min(fin(t, cap.a - .08, .2), clamp((cap.b + .35 - t) / .15));
    const L = cap.words.map(w => w.w).join(' ').length; o += `<div class="cap abs" style="font-size:${L > 36 ? 44 : L > 28 ? 50 : 54}px;opacity:${a};transform:translateY(${(1 - a) * 14}px)">${cap.words.map(w => `<span class="w${cap.hl.includes(w.w) ? ' on' : ''}" style="opacity:${t >= w.s - .03 ? 1 : .45}">${w.w}</span>`).join(' ')}</div>`; }
  // context card: builds as he names each part of the initiative
  if (v && t > 19.7) { const a = fin(t, 19.85, .5), r1 = fin(t, 22.65 + .9, .4), r2 = fin(t, 26.45, .4);
    o += `<div class="card abs" style="opacity:${a};transform:translateX(${(1 - a) * -60}px)"><h3>مبادرة <span>لأهالينا</span></h3>
      ${r1 > 0 ? `<div class="row" style="opacity:${r1};transform:translateY(${(1 - r1) * 12}px)"><div class="ic">${icon.center}</div><div>بالتعاون مع مركز النهضة الطبي</div></div>` : ''}
      ${r2 > 0 ? `<div class="row" style="opacity:${r2};transform:translateY(${(1 - r2) * 12}px)"><div class="ic">${icon.steth}</div><div>كشف باطني</div></div>` : ''}</div>`; }
  $('ov').innerHTML = o;
  // outro
  const u = t - VDUR, oa = clamp(u / .35); $('outro').style.opacity = oa;
  if (u > 0) { const s = k => fin(u, k, .4);
    $('outro').innerHTML = `<img src="brand_mark.png" class="abs" style="left:415px;top:470px;width:250px;height:250px;border-radius:50%;box-shadow:0 0 0 5px rgba(63,224,208,.45);transform:scale(${.6 + .4 * eo(u / .5)})">
      <div class="abs" style="left:0;right:0;top:770px;text-align:center;font-weight:900;font-size:78px;opacity:${s(.2)}">د. أبو بكر أحمد سند</div>
      <div class="abs" style="left:0;right:0;top:880px;text-align:center;font-weight:700;font-size:38px;color:var(--cyan);opacity:${s(.35)}">أخصائي الجهاز الهضمي والكبد والمناظير</div>
      <div class="abs" style="left:140px;right:140px;top:990px;height:3px;background:linear-gradient(90deg,transparent,var(--teal),transparent);opacity:${s(.5)}"></div>
      <div class="abs" style="left:0;right:0;top:1030px;text-align:center;font-weight:800;font-size:44px;opacity:${s(.6)}">مبادرة لأهالينا · بالتعاون مع مركز النهضة الطبي</div>
      <div class="abs" style="left:0;right:0;top:1150px;text-align:center;font-weight:800;font-size:50px;color:var(--orange);opacity:${s(.9)}">تابعونا للمزيد</div>
      <div class="abs" style="left:0;right:0;top:1260px;text-align:center;opacity:${s(1.1)}"><span class="fb"><svg viewBox="0 0 64 64" width="56" height="56"><circle cx="32" cy="32" r="32" fill="#1877F2"/><path fill="#fff" d="M35.5 52V34.6h5.8l.9-6.8h-6.7v-4.3c0-2 .6-3.3 3.4-3.3h3.6v-6.1c-.6-.1-2.8-.3-5.2-.3-5.2 0-8.7 3.2-8.7 9v5H22.8v6.8h5.8V52z"/></svg><span style="font-weight:700;font-size:28px;color:#5b6b80">Facebook</span><span style="font-weight:800;font-size:44px">Dr.Abobakr Sanad</span></span></div>`; }
  $('hdr').style.opacity = 1 - oa;
  await Promise.all([...document.images].map(i => i.complete ? 0 : i.decode().catch(() => 0)));
};
(async () => { for (const w of [700, 800, 900]) await document.fonts.load(`${w} 40px Cairo`, 'مبادرة لأهالينا'); await document.fonts.ready; await window.seek(0); window.ready = true; })();
</script>
</body>
</html>
