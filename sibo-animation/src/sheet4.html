<!doctype html><html><body style="margin:0"><canvas id="c" width="2000" height="1400"></canvas>
<script type="module">
import { drawSanad } from './sanad.js';
const c = document.getElementById('c').getContext('2d');
if (location.search.includes('char')) {
  drawSanad(c, { x: 1000, y: 1120, s: 1.15, arms: { r: [0.5, 0.95, 'present'], l: [0.08, 0.1, 'rest'] }, face: { mood: 'happy' } }, 0);
  c.globalCompositeOperation = 'destination-out'; c.fillRect(0, 1300, 2000, 100);
} else {
  ['rest', 'M', 'A', 'E', 'O', 'F'].forEach((v, i) => {
    c.save(); c.beginPath(); c.rect((i % 3) * 660, Math.floor(i / 3) * 700, 660, 700); c.clip();
    drawSanad(c, { x: (i % 3) * 660 + 330, y: Math.floor(i / 3) * 700 + 390 + 828, s: 1.2, face: { mood: 'neutral', viseme: v, talk: 0.9 } }, 0);
    c.restore();
    c.font = '700 44px sans-serif'; c.fillStyle = '#123'; c.textAlign = 'center'; c.fillText(v, (i % 3) * 660 + 560, Math.floor(i / 3) * 700 + 80);
  });
}
window.done = true;
</script></body></html>
