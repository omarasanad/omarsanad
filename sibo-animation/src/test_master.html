<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><title>Master rig test</title>
<style>
  @font-face { font-family: 'Cairo'; font-weight: 800; src: url('../assets/fonts/Cairo-800.ttf'); }
  html, body { margin: 0; background: #000; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>window.ready = new Promise((r) => (window.__ok = r));</script>
<script type="module">
// 9-second animation test: the master-rig doctor presenting inside a SIBO scene, lip-synced to a recorded
// Egyptian Arabic voiceover excerpt (test/test_vo.wav, analysed into test/test_env.json).
import { loadMasterRig, drawMaster, performMaster } from './master_rig.js';
import { drawPerson, CAST, INK, blob, rr, outline } from './rig.js';
const c = document.getElementById('c').getContext('2d'), TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const spring = (t, t0, k = 9, d = 0.7) => { if (t < t0) return 0; const x = t - t0; return 1 - Math.exp(-d * k * x) * Math.cos(k * x); };
const win = (t, a, b, d = 0.35) => ease((t - a) / d) * ease((b - t) / d);
const ENV = await (await fetch('../test/test_env.json')).json();
await loadMasterRig();
await document.fonts.load('800 50px Cairo', 'عربي');
window.DURATION = ENV.v.length / ENV.fps;
const CAPS = [[0.15, 1.57, 'تخيل واحد بطنه بتنفخ،'], [1.57, 3.77, 'وعنده إسهال، وتعبان على طول.'], [3.98, 4.82, 'يروح للدكتور،'],
  [4.82, 7.26, 'وأعراضه تتشابه مع القولون العصبي،'], [7.31, 9.12, 'بس لما التعب يفضل مستمر،']];

function bg(t) {
  const g = c.createLinearGradient(0, 0, 0, 1920); g.addColorStop(0, '#e9f6f4'); g.addColorStop(1, '#bfe3df');
  c.fillStyle = g; c.fillRect(0, 0, 1080, 1920);
  c.fillStyle = 'rgba(255,255,255,0.5)'; for (let i = 0; i < 6; i++) { c.beginPath(); c.arc((i * 260 + t * 12) % 1300 - 100, 220 + (i % 2) * 120, 90, 0, TAU); c.fill(); }
  c.fillStyle = '#9fd3cc'; c.fillRect(0, 1640, 1080, 280);
}
function card(x, y, w, h, t, t0, t1, draw) {
  const s = spring(t, t0, 10, 0.75), out = ease((t - t1) / 0.3);
  if (s <= 0 || out >= 1) return;
  c.save(); c.translate(x + w / 2, y + h / 2); c.scale(Math.min(s, 1.06) * (1 - out), Math.min(s, 1.06) * (1 - out)); c.translate(-w / 2, -h / 2);
  c.beginPath(); rr(c, 0, 0, w, h, 36); c.fillStyle = '#fffdf8'; c.fill(); c.lineWidth = 7; c.strokeStyle = INK; c.stroke();
  c.save(); c.beginPath(); rr(c, 0, 0, w, h, 36); c.clip(); draw(w, h); c.restore();
  c.restore();
}
function tag(text, x, y, t, t0, col = '#fff3b0') {
  const s = spring(t, t0, 12, 0.8); if (s <= 0) return;
  c.save(); c.translate(x, y); c.scale(Math.min(s, 1.1), Math.min(s, 1.1)); c.direction = 'rtl';
  c.font = '800 44px Cairo'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const w = c.measureText(text).width + 50; c.beginPath(); rr(c, -w / 2, -38, w, 76, 38); c.fillStyle = col; c.fill(); c.lineWidth = 5; c.strokeStyle = INK; c.stroke();
  c.fillStyle = INK; c.fillText(text, 0, 2); c.restore();
}
function bug(x, y, s, t, ph) {
  c.save(); c.translate(x, y); c.rotate(Math.sin(t * 2 + ph) * 0.5); c.scale(s, s);
  c.beginPath(); c.ellipse(0, 0, 24, 13, 0, 0, TAU); blob(c, '#5cc98a');
  for (let k = -1; k <= 1; k++) { c.beginPath(); c.moveTo(-24, k * 5); c.quadraticCurveTo(-33, k * 5 + Math.sin(t * 12 + k + ph) * 5, -40, k * 7); c.strokeStyle = INK; c.lineWidth = 2.5; c.stroke(); }
  for (const sx of [6, 15]) { c.beginPath(); c.arc(sx, -3, 3, 0, TAU); c.fillStyle = INK; c.fill(); }
  c.restore();
}
// small-intestine coil path inside the card
const COIL = (() => { const p = []; for (let k = 0; k < 6; k++) { const y = 150 + k * 78, a = k % 2 ? 400 : 110, b = k % 2 ? 110 : 400; for (let i = 0; i <= 12; i++) p.push([a + (b - a) * i / 12, y]); if (k < 5) for (let i = 1; i < 9; i++) { const g = -Math.PI / 2 + i / 9 * Math.PI; p.push([b + (k % 2 ? -1 : 1) * Math.cos(g) * 39, y + 39 + Math.sin(g) * 39]); } } return p; })();

window.seek = (T) => {
  const t = T;
  bg(t);
  // 1) the patient's belly inflates while he says "بطنه بتنفخ"
  card(50, 470, 520, 720, t, 0.05, 3.85, (w, h) => {
    c.fillStyle = '#eaf4ff'; c.fillRect(0, 0, w, h);
    const bloat = ease((t - 0.7) / 1.1) * 1.5 + Math.sin(t * 9) * 0.04 * (t > 1.8);
    drawPerson(c, CAST.karim, { x: 260, y: 700, s: 1.05, belly: bloat, arms: t > 1.6 ? { l: [0.15, -1.2, 'open'], r: [0.15, -1.2, 'open'] } : { l: [0.1, 0.1], r: [0.1, 0.1] },
      face: { mood: t > 1.4 ? 'pain' : 'neutral', blink: 0 } }, t);
    if (t > 1.6) for (let i = 0; i < 3; i++) { const ph = (t * 1.2 + i / 3) % 1; c.globalAlpha = 1 - ph; c.strokeStyle = '#ff8a5c'; c.lineWidth = 6; c.beginPath(); c.arc(260, 470, 120 + ph * 90, -0.5, 0.5); c.stroke(); c.beginPath(); c.arc(260, 470, 120 + ph * 90, Math.PI - 0.5, Math.PI + 0.5); c.stroke(); c.globalAlpha = 1; }
  });
  if (t > 0.9 && t < 3.85) tag('انتفاخ', 310, 420, t, 0.9);
  // 2) the doctor visit: IBS?
  card(50, 330, 520, 640, t, 4.0, 7.15, (w, h) => {
    c.fillStyle = '#f4fbff'; c.fillRect(0, 0, w, h);
    c.save(); c.translate(w / 2, 330); c.rotate(Math.sin(t * 2) * 0.03);
    c.beginPath(); rr(c, -150, -190, 300, 380, 24); c.fillStyle = '#c98b52'; c.fill(); outline(c, 6);
    c.beginPath(); rr(c, -125, -160, 250, 330, 14); c.fillStyle = '#ffffff'; c.fill(); outline(c, 4);
    c.direction = 'rtl'; c.font = '800 46px Cairo'; c.textAlign = 'center'; c.fillStyle = INK; c.fillText('القولون', 0, -70); c.fillText('العصبي', 0, -10);
    c.font = '800 120px Cairo'; c.fillStyle = '#e4572e'; c.fillText('؟', 0, 130 + Math.sin(t * 6) * 6);
    c.restore();
  });
  // 3) SIBO: bacteria moving inside the small intestine
  card(40, 300, 540, 760, t, 7.2, 99, (w, h) => {
    c.fillStyle = '#fff4ee'; c.fillRect(0, 0, w, h);
    c.lineJoin = 'round'; c.lineCap = 'round';
    c.strokeStyle = INK; c.lineWidth = 64; c.beginPath(); COIL.forEach(([x, y], i) => (i ? c.lineTo(x + 15, y + 60) : c.moveTo(x + 15, y + 60))); c.stroke();
    c.strokeStyle = '#ff9fb0'; c.lineWidth = 50; c.beginPath(); COIL.forEach(([x, y], i) => (i ? c.lineTo(x + 15, y + 60) : c.moveTo(x + 15, y + 60))); c.stroke();
    const n = Math.floor(clamp((t - 7.5) / 1.2) * 14);
    for (let k = 0; k < n; k++) { const u = ((t - 7.2) * 0.07 + k / 14) % 1, p = COIL[Math.floor(u * (COIL.length - 1))]; bug(p[0] + 15, p[1] + 60, 0.75, t, k); }
  });
  if (t > 7.4) tag('SIBO', 310, 245, t, 7.4, '#ffe08a');
  // the doctor: one character, speaking with the voiceover
  const pointPatient = win(t, 0.5, 3.6), pointGut = win(t, 7.55, 99);
  const mood = t < 3.85 ? 'concern' : t < 7.25 ? 'neutral' : 'surprise';
  const moodAmt = t < 3.85 ? ease((t - 0.3) / 0.4) : t >= 7.25 ? ease((t - 7.25) / 0.3) * 0.7 : 1;
  const st = performMaster(ENV, t, { mood, moodAmt, point: pointGut > 0 ? { side: 'l', amt: pointGut, angle: 1.78 } : { side: 'l', amt: pointPatient, angle: 1.86 }, lookX: -0.4 });
  const enter = ease(t / 0.5);
  drawMaster(c, 800 + (1 - enter) * 400, 1880, 0.47, st);
  // captions
  const cap = CAPS.find(([a, b]) => t >= a && t < b);
  if (cap) {
    c.save(); c.direction = 'rtl'; c.font = '800 46px Cairo'; c.textAlign = 'center'; c.textBaseline = 'middle';
    const w = c.measureText(cap[2]).width + 64; c.beginPath(); rr(c, 540 - w / 2, 1738, w, 84, 26); c.fillStyle = 'rgba(14,22,38,0.85)'; c.fill();
    c.fillStyle = '#fff'; c.fillText(cap[2], 540, 1782); c.restore();
  }
};
window.HAS_DOCTOR = true;
seek(0);
window.__ok(true);
</script></body></html>
